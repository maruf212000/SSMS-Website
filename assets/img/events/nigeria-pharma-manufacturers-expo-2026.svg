<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SSMS Engineers at the 8th Nigeria Pharma Manufacturers' Expo and Nigeria Lab Expo, Lagos, 28-29 September 2026, Hall 2 Booth 238">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b204f"/>
      <stop offset="0.55" stop-color="#0a1c46"/>
      <stop offset="1" stop-color="#081737"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="1" r="0.9">
      <stop offset="0" stop-color="#3fae2a" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#3fae2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- skyline -->
  <g fill="#ffffff" opacity="0.08">
    <rect x="700" y="470" width="60" height="160"/>
    <rect x="770" y="430" width="40" height="200"/>
    <rect x="822" y="500" width="70" height="130"/>
    <rect x="904" y="400" width="34" height="230"/>
    <rect x="950" y="460" width="80" height="170"/>
    <rect x="1044" y="380" width="30" height="250"/>
    <rect x="1050" y="352" width="6" height="28"/>
    <rect x="1088" y="470" width="90" height="160"/>
  </g>

  <!-- left column -->
  <g font-family="'Montserrat','Helvetica Neue',Arial,sans-serif">
    <text x="72" y="96" font-size="40" font-weight="800" letter-spacing="3">
      <tspan fill="#3fae2a">SSMS</tspan><tspan fill="#ffffff"> ENGINEERS</tspan>
    </text>
    <rect x="72" y="120" width="120" height="3" fill="#3fae2a"/>

    <text x="72" y="182" font-size="21" font-weight="600" font-style="italic" fill="#4fc23a" letter-spacing="1">
      We cordially invite you to visit
    </text>

    <text x="72" y="214" font-size="13" font-weight="700" letter-spacing="3" fill="#9fb4dd">8TH EDITION</text>

    <text x="72" y="262" font-size="36" font-weight="800" fill="#ffffff">Nigeria Pharma Manufacturers&#8217; Expo</text>
    <text x="72" y="306" font-size="36" font-weight="800" fill="#ffffff">
      <tspan fill="#4fc23a">&amp;</tspan> Nigeria Lab Expo
    </text>

    <text x="72" y="372" font-size="34" font-weight="800" fill="#ffffff">September 28 &amp; 29, 2026</text>
    <rect x="72" y="388" width="360" height="3" fill="#3fae2a"/>

    <!-- stall block -->
    <g transform="translate(72,430)">
      <rect x="0" y="0" width="340" height="110" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="60" y="34" font-size="12" font-weight="600" letter-spacing="2" fill="#9fb4dd" text-anchor="middle">HALL NO.</text>
      <text x="60" y="82" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
      <rect x="170" y="24" width="1" height="62" fill="#ffffff" fill-opacity="0.22"/>
      <text x="255" y="34" font-size="12" font-weight="600" letter-spacing="2" fill="#9fb4dd" text-anchor="middle">BOOTH NO.</text>
      <text x="255" y="82" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle">238</text>
    </g>

    <!-- footer details -->
    <text x="72" y="576" font-size="15" font-weight="600" fill="#ffffff">Harbour Point, 4 Wilmot Point Road, Victoria Island, Lagos, Nigeria</text>
    <text x="72" y="602" font-size="14" fill="#9fb4dd">10:00 am &#8211; 5:00 pm &#160;&#183;&#160; Entry for 18 years and above &#160;&#183;&#160; www.ssmsengineers.com &#160;&#183;&#160; info@ssmsengineers.com</text>
  </g>
</svg>
